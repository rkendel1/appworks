name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm boundary:check
      - run: pnpm release:check

  # The assessment of a whole real application, and the extraction of one of its operations verified against it:
  # Memos (public fork) at the pinned revision: c0eeec7 plus the bridge's manifest attribute pass-through. Memos is built
  # outside the read-only checkout and run with synthetic data only; no credentials or secrets are used.
  memos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rkendel1/memos
          ref: e0ce8569589b2eccafd13e262ea3e320251858f2
          path: _memos
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: _memos/go.mod
          cache: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm vitest run packages/assessment/test/memos-full.test.ts
        env:
          APPWORKS_MEMOS_REPO: ${{ github.workspace }}/_memos
      # Assess, build Memos (outside the checkout), run the behavioral suite against the real operation and the published
      # fulfillment claim, extract, verify, require the committed revisions/2/extraction.json to be exactly what this run
      # produces, confirm the checkout is unchanged, and require every known adapter defect (mutant) to be caught.
      - run: pnpm extraction:memos --check --mutations
        env:
          MEMOS_REPO: ${{ github.workspace }}/_memos
      # The same revision through the project workspace, end to end: acquisition through @appport/github (the job's
      # read-only token, referenced by name and never recorded), discovery of the running unmodified bridge, assessment,
      # reconciliation, approval, the extraction runner, verification, readiness; the checkouts and history unchanged.
      - run: pnpm vitest run packages/workspace/test/memos-e2e.test.ts
        env:
          APPWORKS_MEMOS_E2E: "1"
          APPWORKS_MEMOS_REPO: ${{ github.workspace }}/_memos
          GITHUB_TOKEN: ${{ github.token }}
